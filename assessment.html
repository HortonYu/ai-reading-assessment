<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>综合测评进行中 - 全维语言能力测定</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <header class="bg-white border-b border-slate-200 h-16 flex items-center px-6 justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <span class="text-blue-800 font-extrabold text-base">📘 全维语言 AI 测评</span>
      <span class="text-slate-300">|</span>
      <span id="nav-student-info" class="text-xs text-slate-500 font-medium">考生: 正在初始化...</span>
    </div>
    <div class="flex items-center space-x-3 text-xs">
      <span id="step-indicator" class="font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded-full border border-blue-200">模块一：听力理解</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-black text-blue-900 tracking-tight">综合测评进行中</h2>
      <p class="text-xs text-slate-500 mt-1">请保持环境安静，按照提示认真作答</p>
    </div>

    <!-- 真实 DeepSeek 出题进度动画 -->
    <div id="loading-box" class="bg-white p-12 rounded-2xl border border-slate-200 shadow-sm text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-4"></div>
      <h3 class="text-base font-bold text-slate-800" id="loading-title">DeepSeek 正在根据所选年级原创命制试卷...</h3>
      <p class="text-xs text-slate-500 mt-2" id="loading-timer">已耗时 1 秒 · DeepSeek-V3 正在生成听力、口语、阅读与写作</p>
    </div>

    <!-- 考卷主容器 -->
    <div id="test-container" class="hidden bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">

      <!-- 模块 1: 听力理解 -->
      <section id="module-listening" class="space-y-6">
        <div class="border-b border-slate-100 pb-3">
          <span class="text-xs font-bold text-blue-600 uppercase">模块一：听力理解</span>
          <h3 class="text-base font-bold text-slate-900 mt-1">点击播放听力材料，回答下方问题</h3>
        </div>

        <div class="bg-slate-50 border border-slate-200 p-5 rounded-xl flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <button type="button" onclick="playListeningAudio()" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white rounded-lg text-xs font-bold flex items-center space-x-1.5 transition">
              <span>🔊</span>
              <span id="play-text">播报完整听力材料</span>
            </button>
            <span class="text-xs text-slate-500">（标准普通话 AI 语音合成）</span>
          </div>
          <span class="text-xs text-slate-400">建议听 1-2 遍</span>
        </div>

        <div id="listening-questions" class="space-y-4 pt-2"></div>
      </section>

      <!-- 模块 2: 口语表达 -->
      <section id="module-speaking" class="hidden space-y-6">
        <div class="border-b border-slate-100 pb-3">
          <span class="text-xs font-bold text-blue-600 uppercase">模块二：口语表达</span>
          <h3 class="text-base font-bold text-slate-900 mt-1">请大声、饱满、自然地朗读以下段落</h3>
        </div>

        <div class="bg-slate-50 border border-slate-200 p-6 rounded-2xl">
          <h4 id="spk-title" class="font-bold text-slate-900 text-base mb-3 text-center">朗读短文</h4>
          <p id="spk-passage" class="text-xl md:text-2xl text-slate-800 leading-relaxed tracking-wide select-none"></p>
        </div>

        <div class="flex flex-col items-center justify-center pt-2 space-y-3">
          <button type="button" id="btn-spk-record" onclick="toggleSpeakingRecord()" class="w-16 h-16 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg">
            <span class="text-2xl">🎙️</span>
          </button>
          <span id="spk-status" class="text-xs font-semibold text-slate-600">点击麦克风开始朗读录音</span>
        </div>
      </section>

      <!-- 模块 3: 阅读理解 -->
      <section id="module-reading" class="hidden space-y-6">
        <div class="border-b border-slate-100 pb-3">
          <span class="text-xs font-bold text-blue-600 uppercase">模块三：阅读理解</span>
          <h3 class="text-base font-bold text-slate-900 mt-1">请仔细阅读短文，完成深度理解题</h3>
        </div>

        <div class="bg-slate-50 border border-slate-200 p-6 rounded-2xl">
          <h4 id="read-title" class="font-bold text-slate-900 text-base mb-3 text-center">阅读文章</h4>
          <p id="read-passage" class="text-base text-slate-800 leading-relaxed tracking-normal select-none"></p>
        </div>

        <div id="reading-questions" class="space-y-4 pt-2"></div>
      </section>

      <!-- 模块 4: 核心写作 -->
      <section id="module-writing" class="hidden space-y-6">
        <div class="border-b border-slate-100 pb-3">
          <span class="text-xs font-bold text-blue-600 uppercase">模块四：核心写作</span>
          <h3 class="text-base font-bold text-slate-900 mt-1" id="write-topic">情境小作文</h3>
        </div>

        <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-xs text-blue-900 leading-relaxed" id="write-prompt"></div>

        <div>
          <textarea id="write-input" rows="6" oninput="updateWordCount()" placeholder="请在此输入你的作文内容..." class="w-full p-4 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50"></textarea>
          <div class="text-right text-xs text-slate-400 mt-1">已输入 <span id="write-count" class="font-bold text-slate-700">0</span> 字</div>
        </div>
      </section>

      <!-- 底部步骤切换按钮 -->
      <div class="flex justify-between items-center pt-6 border-t border-slate-100">
        <button type="button" id="btn-prev" onclick="prevStep()" class="hidden px-5 py-2.5 border border-slate-300 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50">
          ← 上一步
        </button>
        <div class="flex-1"></div>
        <button type="button" id="btn-next" onclick="nextStep()" class="px-6 py-2.5 bg-blue-800 hover:bg-blue-900 text-white rounded-xl text-xs font-bold shadow transition">
          下一题：口语表达 →
        </button>
      </div>

    </div>
  </main>

  <script>
    var currentStep = 1;
    var currentExamData = null;
    var studentAnswers = { listening: {}, speaking_duration: 0, reading: {}, writing: "" };
    var isSpkRecording = false;
    var spkTimer = null;
    var spkDuration = 0;
    var listeningPassageText = "";

    window.onload = function() {
      var studentId = localStorage.getItem("current_student_id") || "体验考生";
      var grade = localStorage.getItem("current_student_grade") || "mid";
      var gradeNames = { "low": "低年级 (1-2年级)", "mid": "中年级 (3-4年级)", "high": "高年级 (5-6年级)" };
      document.getElementById("nav-student-info").innerText = "考生: " + studentId + " | 学段: " + (gradeNames[grade] || grade);

      var elapsed = 1;
      var timer = setInterval(function() {
        elapsed++;
        var el = document.getElementById("loading-timer");
        if (el) el.innerText = "已耗时 " + elapsed + " 秒 · DeepSeek-V3 正在构思四模块原创考题 (约 8-15 秒)";
      }, 1000);

      // 向后端发起真实的 DeepSeek 命题请求
      fetch("/api/generate_all_modules", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ grade: grade, student_id: studentId })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.detail || "出题失败");
          return data;
        });
      })
      .then(function(json) {
        clearInterval(timer);
        if (json.status === "success" && json.data) {
          currentExamData = json.data;
          renderAIGeneratedExam(currentExamData);
        }
      })
      .catch(function(err) {
        clearInterval(timer);
        alert("【DeepSeek 出题受阻】：\n" + err.message);
      });
    };

    function renderAIGeneratedExam(d) {
      document.getElementById("loading-box").classList.add("hidden");
      document.getElementById("test-container").classList.remove("hidden");

      if (d.listening) {
        listeningPassageText = d.listening.passage || "";
        var lq = document.getElementById("listening-questions");
        lq.innerHTML = "";
        (d.listening.questions || []).forEach(function(q, idx) {
          lq.appendChild(createQuestionCard("listening", q, idx));
        });
      }

      if (d.speaking) {
        document.getElementById("spk-title").innerText = d.speaking.title || "口语朗读篇目";
        document.getElementById("spk-passage").innerText = d.speaking.passage || "";
      }

      if (d.reading) {
        document.getElementById("read-title").innerText = d.reading.title || "阅读短文";
        document.getElementById("read-passage").innerText = d.reading.passage || "";
        var rq = document.getElementById("reading-questions");
        rq.innerHTML = "";
        (d.reading.questions || []).forEach(function(q, idx) {
          rq.appendChild(createQuestionCard("reading", q, idx));
        });
      }

      if (d.writing) {
        document.getElementById("write-topic").innerText = "模块四：写作 · " + (d.writing.topic || "命题写作");
        document.getElementById("write-prompt").innerText = d.writing.prompt || "请认真作答。";
      }

      showModule(1, "模块一：听力理解", "下一题：口语表达 →");
    }

    function createQuestionCard(type, q, idx) {
      var card = document.createElement("div");
      card.className = "border border-slate-200 rounded-xl p-4 bg-white mb-3";
      var options = Array.isArray(q.options) ? q.options : ["A. 选项A", "B. 选项B", "C. 选项C", "D. 选项D"];
      
      var html = '<div class="font-bold text-xs text-slate-800 mb-3">' + (idx + 1) + '. ' + q.question + '</div>';
      html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">';
      options.forEach(function(opt) {
        var letter = opt.charAt(0);
        html += '<label class="flex items-center space-x-2 p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer">';
        html += '<input type="radio" name="' + type + '_q_' + q.id + '" value="' + letter + '" onchange="recordChoice(\'' + type + '\', ' + q.id + ', \'' + letter + '\')">';
        html += '<span class="text-slate-700">' + opt + '</span></label>';
      });
      html += '</div>';
      card.innerHTML = html;
      return card;
    }

    function recordChoice(type, qId, val) {
      studentAnswers[type][qId] = val;
    }

    function playListeningAudio() {
      if (!window.speechSynthesis) {
        alert("浏览器不支持语音朗读");
        return;
      }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(listeningPassageText);
      u.lang = "zh-CN";
      u.rate = 0.9;
      document.getElementById("play-text").innerText = "正在播报中...";
      u.onend = function() {
        document.getElementById("play-text").innerText = "播报完毕 (点击可重听)";
      };
      window.speechSynthesis.speak(u);
    }

    function toggleSpeakingRecord() {
      var btn = document.getElementById("btn-spk-record");
      if (!isSpkRecording) {
        isSpkRecording = true;
        spkDuration = 0;
        btn.style.backgroundColor = "#059669";
        spkTimer = setInterval(function() {
          spkDuration++;
          document.getElementById("spk-status").innerText = "🎙️ 正在录音：" + spkDuration + " 秒 (读完再次点击停止)";
        }, 1000);
      } else {
        isSpkRecording = false;
        clearInterval(spkTimer);
        studentAnswers.speaking_duration = spkDuration;
        btn.style.backgroundColor = "#f43f5e";
        document.getElementById("spk-status").innerText = "录音完成 (用时 " + spkDuration + " 秒)，请点击下一题";
      }
    }

    function updateWordCount() {
      var val = document.getElementById("write-input").value;
      studentAnswers.writing = val;
      document.getElementById("write-count").innerText = val.length;
    }

    function showModule(step, titleText, nextBtnText) {
      currentStep = step;
      document.getElementById("step-indicator").innerText = titleText;
      document.getElementById("btn-next").innerText = nextBtnText;
      document.getElementById("btn-prev").classList.toggle("hidden", step === 1);

      document.getElementById("module-listening").classList.toggle("hidden", step !== 1);
      document.getElementById("module-speaking").classList.toggle("hidden", step !== 2);
      document.getElementById("module-reading").classList.toggle("hidden", step !== 3);
      document.getElementById("module-writing").classList.toggle("hidden", step !== 4);
      window.scrollTo(0, 0);
    }

    function nextStep() {
      if (currentStep === 1) showModule(2, "模块二：口语表达", "下一题：阅读理解 →");
      else if (currentStep === 2) showModule(3, "模块三：阅读理解", "下一题：核心写作 →");
      else if (currentStep === 3) showModule(4, "模块四：核心写作", "提交并由 DeepSeek 批阅 🚀");
      else if (currentStep === 4) submitAllAnswers();
    }

    function prevStep() {
      if (currentStep === 2) showModule(1, "模块一：听力理解", "下一题：口语表达 →");
      else if (currentStep === 3) showModule(2, "模块二：口语表达", "下一题：阅读理解 →");
      else if (currentStep === 4) showModule(3, "模块三：阅读理解", "下一题：核心写作 →");
    }

    // 提交答卷给 DeepSeek 深度阅卷打分
    function submitAllAnswers() {
      document.getElementById("test-container").classList.add("hidden");
      var loadBox = document.getElementById("loading-box");
      loadBox.classList.remove("hidden");
      document.getElementById("loading-title").innerText = "DeepSeek 正在深度批阅听、说、读、写作答...";
      document.getElementById("loading-timer").innerText = "正在客观核对答案、精批作文内容、生成能力断层图谱 (约 8-15 秒)...";

      var studentId = localStorage.getItem("current_student_id") || "测试学生";
      var grade = localStorage.getItem("current_student_grade") || "mid";

      fetch("/api/evaluate_submission", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          student_id: studentId,
          grade: grade,
          test_data: currentExamData,
          student_answers: studentAnswers
        })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.detail || "批阅失败");
          return data;
        });
      })
      .then(function(json) {
        if (json.status === "success" && json.data) {
          localStorage.setItem("assessment_result", JSON.stringify(json.data));
          window.location.href = "result.html";
        }
      })
      .catch(function(err) {
        alert("【DeepSeek 批阅失败】：\n" + err.message);
        document.getElementById("loading-box").classList.add("hidden");
        document.getElementById("test-container").classList.remove("hidden");
      });
    }
  </script>
</body>
</html>
